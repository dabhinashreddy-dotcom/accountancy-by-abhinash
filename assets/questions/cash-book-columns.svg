<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="cbTitle cbDesc" font-family="Segoe UI, system-ui, sans-serif">
  <title id="cbTitle">Triple-column Cash Book</title>
  <desc id="cbDesc">A cash book with three amount columns on the debit side — Cash, Bank and Discount — and the same three columns on the credit side, split by a central Date and Particulars half.</desc>
  <rect width="720" height="250" fill="#F7F5EF"/>
  <rect x="20" y="40" width="680" height="170" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
  <line x1="360" y1="40" x2="360" y2="210" stroke="#14213D" stroke-width="2.5"/>
  <line x1="20" y1="84" x2="700" y2="84" stroke="#14213D" stroke-width="2.5"/>
  <text x="190" y="70" fill="#2B5FA6" font-size="18" font-weight="700" text-anchor="middle">Debit (receipts)</text>
  <text x="530" y="70" fill="#5B4E8C" font-size="18" font-weight="700" text-anchor="middle">Credit (payments)</text>
  <g stroke="#D8D3C6" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="210"/><line x1="180" y1="84" x2="180" y2="210"/>
    <line x1="240" y1="84" x2="240" y2="210"/><line x1="300" y1="84" x2="300" y2="210"/>
    <line x1="440" y1="40" x2="440" y2="210"/><line x1="520" y1="84" x2="520" y2="210"/>
    <line x1="580" y1="84" x2="580" y2="210"/><line x1="640" y1="84" x2="640" y2="210"/>
  </g>
  <g fill="#14213D" font-size="12.5" font-weight="600">
    <text x="60" y="108" text-anchor="middle">Date</text><text x="140" y="108" text-anchor="middle">Particulars</text>
    <text x="210" y="108" text-anchor="middle">Cash</text><text x="270" y="108" text-anchor="middle">Bank</text><text x="330" y="108" text-anchor="middle">Discount</text>
    <text x="400" y="108" text-anchor="middle">Date</text><text x="480" y="108" text-anchor="middle">Particulars</text>
    <text x="550" y="108" text-anchor="middle">Cash</text><text x="610" y="108" text-anchor="middle">Bank</text><text x="670" y="108" text-anchor="middle">Discount</text>
  </g>
  <g stroke="#D8D3C6" stroke-width="1">
    <line x1="20" y1="122" x2="700" y2="122"/><line x1="20" y1="160" x2="700" y2="160"/>
  </g>
  <text x="360" y="240" fill="#6B6478" font-size="14" text-anchor="middle">Discount allowed appears on the payment side; discount received on the receipt side</text>
</svg>
