<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="depTitle depDesc" font-family="Segoe UI, system-ui, sans-serif">
  <title id="depTitle">Depreciation each year: straight line method compared with written down value method</title>
  <desc id="depDesc">Grouped bar chart over four years for an asset costing one lakh with four years of useful life and no residual value. The straight line method charges the same 25,000 every year. The written down value method at 20 per cent charges 20,000 in year one, then 16,000, then 12,800, then 10,240 — a shrinking amount each year.</desc>
  <rect width="720" height="300" fill="#F7F5EF"/>
  <line x1="110" y1="250" x2="700" y2="250" stroke="#14213D" stroke-width="2"/>
  <line x1="110" y1="30" x2="110" y2="250" stroke="#14213D" stroke-width="2"/>
  <g stroke="#D8D3C6" stroke-width="1">
    <line x1="110" y1="196" x2="700" y2="196"/>
    <line x1="110" y1="142" x2="700" y2="142"/>
    <line x1="110" y1="88" x2="700" y2="88"/>
  </g>
  <g fill="#6B6478" font-size="11" text-anchor="end">
    <text x="104" y="254">0</text><text x="104" y="200">7,500</text>
    <text x="104" y="146">15,000</text><text x="104" y="92">22,500</text>
  </g>
  <g fill="#2B5FA6">
    <rect x="140" y="70" width="44" height="180"/>
    <rect x="280" y="70" width="44" height="180"/>
    <rect x="420" y="70" width="44" height="180"/>
    <rect x="560" y="70" width="44" height="180"/>
  </g>
  <g fill="#C9A227">
    <rect x="190" y="106" width="44" height="144"/>
    <rect x="330" y="135" width="44" height="115"/>
    <rect x="470" y="158" width="44" height="92"/>
    <rect x="610" y="176" width="44" height="74"/>
  </g>
  <g fill="#14213D" font-size="11.5" text-anchor="middle">
    <text x="162" y="62">25,000</text><text x="302" y="62">25,000</text><text x="442" y="62">25,000</text><text x="582" y="62">25,000</text>
    <text x="212" y="98">20,000</text><text x="352" y="127">16,000</text><text x="492" y="150">12,800</text><text x="632" y="168">10,240</text>
  </g>
  <g fill="#6B6478" font-size="13" font-weight="600" text-anchor="middle">
    <text x="192" y="270">Year 1</text><text x="332" y="270">Year 2</text><text x="472" y="270">Year 3</text><text x="612" y="270">Year 4</text>
  </g>
  <rect x="130" y="18" width="13" height="13" fill="#2B5FA6"/><text x="150" y="29" fill="#14213D" font-size="12.5">Straight line method</text>
  <rect x="330" y="18" width="13" height="13" fill="#C9A227"/><text x="350" y="29" fill="#14213D" font-size="12.5">Written down value method (20%)</text>
  <text x="405" y="292" fill="#6B6478" font-size="12.5" text-anchor="middle">Cost ₹1,00,000 · useful life 4 years · no residual value · depreciation charged each year</text>
</svg>
